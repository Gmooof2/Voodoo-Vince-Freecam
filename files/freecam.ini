; Voodoo Vince Remastered free camera - settings (all optional)
[freecam]
; virtual-key code for the toggle key (0x74 = F5)
toggle_key=0x74
; units per second (Vince is about 0.25 units tall)
move_speed=1.5
mouse_sensitivity=0.0025
pad_look_speed=1.8
key_look_speed=1.5
invert_x=0
invert_y=0
; 1 = stop Vince responding to input while flying during gameplay
freeze_vince=1
